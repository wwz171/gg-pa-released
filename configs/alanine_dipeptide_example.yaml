shared:
  checkpoint: checkpoints/ad_torsion_prior.pt
  output_root: examples/alanine_dipeptide/results
  forcefield_files:
    - amber99sbildn.xml
    - tip3p.xml
  device: cpu
  platform_name: CUDA
  master_seed: 42
  n_reverse_steps: 200
  kappa: 1.0
  k_max: 1
  nonbonded_mode: none
  internal_strength_scaling:
    dihedral: 0.0

ad_sodium:
  pdb: data/adp_monomer_vacuum.pdb
  temperature: 300.0
  friction: 1.0
  timestep: 0.001
  t_diff: 0.1
  md_steps: 100
  n_steps: 5000
  record_interval: 1
  print_every: 500
  compute_reduced_potential: false
  save_dcd: true
  dcd_interval: 100
  minimize_before_md: false
  ion_element_symbol: Na
  ion_resname: NA
  ion_atom_name: "Na+"
  ion_offset_nm: 0.5
  leash_r0_nm: 0.4
  leash_k_kj_mol_nm2: 50.0
  output_dir: examples/alanine_dipeptide/results/ad_sodium_single

ad_sodium_ensemble:
  output_dir: examples/alanine_dipeptide/results/ad_sodium
  n_trajectories: 5
  seeds: [42, 43, 44, 45, 46]
  burnin_fraction: 0.2
  max_plot_points: 16000

ad_dimer:
  pdb: data/adp_dimer_vacuum.pdb
  temperature: 300.0
  friction: 1.0
  timestep: 0.002
  t_diff_list:
    - 0.1
    - 0.15
    - 0.25
    - 0.4
  md_steps: 100
  n_blocks: 1000
  inner_steps: 1
  record_interval: 1
  print_every: 100
  save_positions: true
  save_dcd: true
  dcd_interval: 100
  minimize_before_md: false
  centering_force_k: 50.0
  centering_d0: 0.9
  centering_warmup_steps: 0
  centering_schedule: always
  burnin_fraction: 0.2
  output_dir: examples/alanine_dipeptide/results/ad_dimer
