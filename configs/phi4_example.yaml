model:
  checkpoint: checkpoints/phi4_prior.pt

runtime:
  device: cuda
  compile_model: false
  quiet: false
  output_root: examples/phi4/results

diffusion:
  t_prod: 0.1
  t_max: 0.6
  n_replicas: 48

phase_transition:
  L: 32
  h: 0.0
  seed: 42
  n_sweeps: 10000
  critical_window:
    start: 0.40
    stop: 0.48
    n_sweeps: 30000
  record_interval: 1
  burnin_fraction: 0.3
  save_all_replicas: true
  output_dir: examples/phi4/results/phase_transition
  gamma_grid_segments:
    - start: 0.05
      stop: 0.95
      num: 15
    - start: 0.30
      stop: 0.55
      num: 15

critical_scaling:
  L: 32
  seed: 42
  n_sweeps: 10000
  record_interval: 1
  burnin_fraction: 0.3
  save_all_replicas: true
  resume: false
  output_dir: examples/phi4/results/critical_scaling
  h_values: [0.008, 0.012, 0.02]
  gamma_c: 0.436
  window_half: 2.0
  n_gamma: 10
  gamma_min: 0.10
  gamma_max: 0.80

plotting:
  output_dir: examples/phi4/results/figures
  gamma_c: 0.436
  beta: 0.125
  delta: 15.0
