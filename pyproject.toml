[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ggpa"
version = "0.1.0"
description = "Generative Gibbs for Physics-Aware Sampling"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [{ name = "Weizhou Wang" }]
keywords = [
  "diffusion models",
  "sampling",
  "replica exchange",
  "statistical physics",
  "mcmc",
]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "torch==2.3.0",
  "numpy==1.26.4",
  "PyYAML==6.0.1",
  "ipykernel==6.28.0",
  "jupyterlab==4.0.11",
  "matplotlib==3.8.4",
  "pymbar==4.0.3",
  "seaborn==0.13.2",
  "mdtraj==1.10.3",
  "openmm==8.3.1",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["ggpa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
