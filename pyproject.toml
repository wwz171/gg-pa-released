[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ggpa"
version = "0.1.0"
description = "Generative Gibbs for Physics-Aware Sampling"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Weizhou Wang" }]
keywords = [
  "diffusion models",
  "sampling",
  "replica exchange",
  "statistical physics",
  "mcmc",
]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.20",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
torch = [
  "torch>=2.0",
]
notebooks = [
  "ipykernel>=6.0",
  "jupyterlab>=4.0",
  "matplotlib>=3.5",
  "pymbar>=4.0",
  "seaborn>=0.12",
]
alanine = [
  "mdtraj>=1.9.9",
  "openmm>=8.0",
]
dev = [
  "build>=1.2",
  "pytest>=7.0",
  "twine>=5.0",
]
all = [
  "torch>=2.0",
  "ipykernel>=6.0",
  "jupyterlab>=4.0",
  "matplotlib>=3.5",
  "pymbar>=4.0",
  "PyYAML>=6.0",
  "seaborn>=0.12",
  "mdtraj>=1.9.9",
  "openmm>=8.0",
  "build>=1.2",
  "pytest>=7.0",
  "twine>=5.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["ggpa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
